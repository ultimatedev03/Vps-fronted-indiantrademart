name: One-time GA analytics deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ITM_VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ITM_VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy GA4 business analytics
        env:
          VPS_HOST: ${{ secrets.ITM_VPS_HOST }}
        run: |
          ssh -i ~/.ssh/id_ed25519 root@"$VPS_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          cd /opt/indiantrademart-frontend
          git fetch origin main
          git pull --ff-only origin main
          git merge-base --is-ancestor 25e22fc HEAD
          npm ci

          export VITE_GTAG_ID="G-P0C7N2ZTP5"
          npm run build

          web_root="$(readlink -f /var/www/indiantrademart)"
          test "$web_root" = "/var/www/indiantrademart"
          rsync -a --delete --exclude=robots.txt dist/ "$web_root/"

          grep -q 'G-P0C7N2ZTP5' "$web_root/index.html"
          grep -R -q 'generate_lead' "$web_root/assets"
          grep -R -q 'view_vendor' "$web_root/assets"
          grep -R -q 'itm_user_role' "$web_root/assets"
          printf 'deploy-complete commit=%s\n' "$(git rev-parse --short HEAD)"
          REMOTE
